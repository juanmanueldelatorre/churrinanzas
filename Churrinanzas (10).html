 const months={};
 for(const r of rows){

function validBackup(obj){
 if(!obj||obj.version!==2||!obj.months||Array.isArray(obj.months)||typeof obj.months!=='object')return false;
 const record=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const amount=x=>x==null||(Number.isSafeInteger(x)&&x>=0);
 return Object.entries(obj.months).every(([k,m])=>/^\d{4}-(0[1-9]|1[0-2])$/.test(k)&&record(m)&&
  ['salary','expenses','services','cards','weeks','analysis'].every(f=>record(m[f]))&&
  ['salary','expenses','cards'].every(f=>Object.values(m[f]).every(amount))&&amount(m.legacyCredit)&&
  (m.share==null||(typeof m.share==='number'&&m.share>=0&&m.share<=100))&&
  (m.closed==null||(typeof m.closed==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(m.closed)))&&
  Object.values(m.services).every(s=>record(s)&&amount(s.amount)&&['card','direct'].includes(s.via))&&
  Object.values(m.weeks).every(w=>record(w)&&Object.values(w).every(amount))&&
  Object.values(m.analysis).every(a=>record(a)&&typeof a.file==='string'&&Array.isArray(a.rows)&&a.rows.every(r=>record(r)&&typeof r.text==='string'&&typeof r.category==='string'&&Number.isSafeInteger(r.amount)&&['ARS','USD','?'].includes(r.currency))&&Array.isArray(a.review)&&a.review.every(s=>typeof s==='string')))
}

const categoryRules=[
 ['Supermercado',/supermerc|carrefour|coto\b|jumbo|la gallega|dia%|disco\b/],
 ['Transporte',/uber|cabify|shell|ypf|axion|estacionamiento|cochera|peaje/],
 ['Comidas y salidas',/restaurant|pedidosya|rappi|caf[eé]|pizzer[ií]a|bar\b|helader/],
 ['Servicios',/litoral gas|aguas santafesinas|expensas|internet|telecom|personal flow|fibertel|epe\b/],
 ['Salud',/farmacia|farmacity|sanatorio|odont|medic|psico/],
 ['Suscripciones',/netflix|spotify|disney|apple\.com|google\s*one|youtube premium/],
 ['Compras',/mercado\s*libre|mercadolibre|amazon|indumentaria|zapat/]
];
function classify(text){
 const label=text.toLowerCase();
 return categoryRules.find(([,rule])=>rule.test(label))?.[0]??'Sin clasificar'
}
const dateStart=/^\s*(?:(?:\d{1,2}[\/.-]){2}\d{2,4}|\d{1,2}[\/.-]\d{1,2}|\d{1,2}[\s-]+(?:ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)(?:[\s.-]+\d{2,4})?)(?=\s)/i;
const exclude=/\b(?:su pago|pago recibido|pago de resumen|saldo anterior|saldo actual|saldo total|total (?:de )?(?:consumos|resumen|a pagar)|pago m[ií]nimo|vencimiento|cierre actual)\b/i;
function parseLines(lines){
 const rows=[],review=[];
 for(const line of lines){
  const date=line.match(dateStart);
  if(!date||exclude.test(line))continue;
  const tail=line.slice(date[0].length).trim();
  const amounts=[...tail.matchAll(/(?:U\$S|US\$|USD|ARS|\$)?\s*-?(?:\d{1,3}(?:\.\d{3})+|\d+),\d{2}(?:-)?(?=\s|$)/gi)];
  if(!amounts.length||amounts.length>2||tail.slice(amounts.at(-1).index+amounts.at(-1)[0].length).trim()||!/[a-záéíóú]/i.test(tail.slice(0,amounts[0].index))){
   review.push(line);continue
  }
  const text=tail.slice(0,amounts[0].index).trim();
  const explicit=a=>/U\$S|US\$|USD/i.test(a)?'USD':/ARS|\$/i.test(a)?'ARS':'?';
  for(const a of amounts){
   const raw=a[0], numeric=raw.replace(/[^0-9,.-]/g,'');
   const amount=Math.round(Number(numeric.replace(/\./g,'').replace(',','.').replace(/-$/,''))*100)*(numeric.endsWith('-')?-(numeric.startsWith('-')?-1:1):1);
   if(!Number.isSafeInteger(amount)){review.push(line);continue}
   rows.push({date:date[0].trim(),text,category:classify(text),currency:explicit(raw),amount});
  }
 }
 return {rows,review}
}
function showAnalysis(a){

 const groups=new Map();
 const f=(c,v)=>c==='USD'?usd.format(v/100):c==='ARS'?fmt(v):new Intl.NumberFormat('es-AR',{minimumFractionDigits:2}).format(v/100)+' (moneda por verificar)';
 for(const r of a.rows)if(r.currency!=='?'){
  const k=r.category+' · '+r.currency;
  groups.set(k,{currency:r.currency,amount:(groups.get(k)?.amount??0)+r.amount})
 }
 const doubtful=a.rows.filter(r=>r.currency==='?').length;
 return '<p><strong>'+esc(a.file)+'</strong> · '+a.rows.length+' importes detectados</p>'+
 '<p class="muted">Consumos detectados con moneda explícita · '+fmt(sum(a.rows.filter(r=>r.currency==='ARS').map(r=>r.amount)))+' · '+usd.format(sum(a.rows.filter(r=>r.currency==='USD').map(r=>r.amount))/100)+'</p>'+
 (doubtful?'<div class="notice">'+doubtful+' importes tienen moneda por verificar. Se muestran en el detalle y quedan fuera de los subtotales.</div>':'')+
 (groups.size?'<ul>'+[...groups].map(([k,v])=>'<li>'+esc(k)+' · '+f(v.currency,v.amount)+'</li>').join('')+'</ul>':'')+
 (a.rows.length?'<details open><summary>Detalle de importes detectados</summary><div class="scroll"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría sugerida</th><th>Importe</th></tr></thead><tbody>'+
 a.rows.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.text)+'</td><td>'+esc(r.category)+'</td><td>'+f(r.currency,r.amount)+'</td></tr>').join('')+'</tbody></table></div></details>':'<p class="muted">No se detectaron consumos con el formato esperado.</p>')+
 (a.review.length?'<details><summary>Líneas fechadas para revisar ('+a.review.length+')</summary><ul>'+a.review.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></details>':'')
}
const pdfBase='https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/';
let pdfLib;
async function loadPdf(e){
 const file=e.target.files[0];if(!file)return;
 const period=month,card=pdfCard,status=$('pdfStatus'), control=e.target;
 if(months[period]?.closed)return;
 control.disabled=true;status.textContent='Leyendo el resumen en este dispositivo…';
 let task;
 try{
  if(file.size>20*1024*1024)throw Error('El PDF supera el máximo de 20 MB.');
  if(!pdfLib){
   try{
    const library=await import(pdfBase+'pdf.min.mjs');
    library.GlobalWorkerOptions.workerSrc=pdfBase+'pdf.worker.min.mjs';
    pdfLib=library
   }catch{
    throw Error('No se pudo cargar el lector de PDF. Revisá la conexión y volvé a intentar.')
   }
  }
  task=pdfLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,useWasm:false});
  const pdf=await task.promise;
  if(pdf.numPages>70)throw Error('El PDF supera el máximo de 70 páginas.');
  const lines=[];
  for(let n=1;n<=pdf.numPages;n++){
   const page=await pdf.getPage(n),content=await page.getTextContent();
   const buckets=new Map();
   for(const item of content.items){
    if(!item.str?.trim())continue;
    const y=Math.round(item.transform[5]);
    const near=[y,y-1,y+1].find(v=>buckets.has(v))??y;
    if(!buckets.has(near))buckets.set(near,[]);
    buckets.get(near).push(item)
   }
   for(const [,items] of [...buckets].sort(([a],[b])=>b-a))
    lines.push(items.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str.trim()).join(' '));
  }
  if(!lines.length)throw Error('El PDF no tiene texto seleccionable. Aplicá OCR y volvé a cargarlo.');
  const result=parseLines(lines);
  if(!result.rows.length&&!result.review.length)throw Error('No se encontraron consumos fechados. Verificá que sea un resumen de tarjeta o crédito.');
  if(months[period]?.closed)throw Error('Este mes se cerró mientras se leía el PDF.');
  if(update(d=>{d.analysis[card]={file:file.name,...result}},period)&&month===period&&tab==='cards'&&pdfCard===card)render()
 }catch(err){
  status.textContent=err.name==='PasswordException'?'El PDF está protegido con contraseña. Cargá una copia desbloqueada.':err.message||'No se pudo leer el PDF.'
 }finally{control.disabled=false;control.value='';if(task)await task.destroy().catch(()=>{})}
}
render();
</script>
